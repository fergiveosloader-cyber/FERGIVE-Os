<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FERGIVE OS — Reseller</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060a;--s1:#0d0d14;--s2:#13131c;--s3:#1a1a26;
  --br:#222233;--br2:#2e2e45;
  --g:#7c3aed;--g2:#6d28d9;--ga:rgba(124,58,237,.15);
  --c:#00d4ff;--ca:rgba(0,212,255,.12);
  --red:#ff3860;--yellow:#ffb800;--blue:#00d4ff;
  --t1:#eeeeff;--t2:#7777aa;--t3:#3a3a5c;
  --glow:0 0 24px rgba(124,58,237,.35);
}
body{background:var(--bg);color:var(--t1);font-family:'Space Mono',monospace;min-height:100vh;padding-bottom:60px;overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(124,58,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.04) 1px,transparent 1px);
  background-size:32px 32px;pointer-events:none;z-index:0
}
.topbar{
  background:rgba(13,13,20,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--br);padding:14px 20px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100
}
.tb-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#7c3aed,#00d4ff);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;font-family:'Syne',sans-serif;
  box-shadow:var(--glow)
}
.tb-title{font-size:15px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:2px}
.tb-title span{color:var(--g)}
.tb-badge{
  margin-left:auto;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);
  color:var(--blue);font-size:8px;font-weight:700;letter-spacing:2px;
  padding:4px 10px;border-radius:20px
}
.tb-dot{width:7px;height:7px;border-radius:50%;background:#00d4ff;box-shadow:0 0 8px #00d4ff;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:88vh;padding:20px;position:relative;z-index:1}
.login-card{
  background:var(--s1);border:1px solid var(--br2);border-radius:18px;padding:32px;width:100%;max-width:360px;
  box-shadow:0 0 60px rgba(124,58,237,.15);position:relative;overflow:hidden
}
.login-card::before{
  content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);pointer-events:none
}
.login-logo{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:4px}
.login-logo span{background:linear-gradient(90deg,#7c3aed,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:9px;color:var(--t3);letter-spacing:2px;margin-bottom:8px}
.reseller-name-display{
  font-size:11px;color:var(--blue);letter-spacing:2px;margin-bottom:24px;
  background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);
  padding:8px 12px;border-radius:8px;text-align:center
}

/* Cards */
.card{
  background:var(--s1);border:1px solid var(--br);border-radius:14px;
  padding:18px;margin-bottom:14px;position:relative;overflow:hidden
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.4),transparent)
}
.card-head{font-size:8px;font-weight:700;color:var(--t3);letter-spacing:3px;margin-bottom:16px}

/* Credits display */
.credits-display{
  text-align:center;padding:24px;
  background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(0,212,255,.05));
  border:1px solid rgba(124,58,237,.2);border-radius:14px;margin-bottom:14px;position:relative;z-index:1
}
.credits-num{
  font-size:52px;font-weight:800;font-family:'Syne',sans-serif;
  background:linear-gradient(90deg,#7c3aed,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1
}
.credits-label{font-size:8px;color:var(--t3);letter-spacing:3px;margin-top:8px}
.credits-sub{font-size:9px;color:var(--t2);margin-top:4px}

/* Form */
.lbl{font-size:9px;color:var(--t3);letter-spacing:1px;margin-bottom:5px;margin-top:12px;display:block}
.lbl:first-child{margin-top:0}
.inp{
  width:100%;background:var(--s2);border:1px solid var(--br2);
  border-radius:10px;color:var(--t1);font-family:'Space Mono',monospace;
  font-size:13px;padding:11px 14px;outline:none;transition:all .2s
}
.inp:focus{border-color:rgba(124,58,237,.5);box-shadow:0 0 0 3px rgba(124,58,237,.08)}
.inp::placeholder{color:var(--t3)}
select.inp option{background:var(--s2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}

/* Buttons */
.btn{
  width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:all .2s
}
.btn-g{
  background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,.35)
}
.btn-g:hover{box-shadow:0 6px 28px rgba(124,58,237,.5);transform:translateY(-1px)}
.btn-g:active{transform:scale(.98)}
.btn-g:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-s{background:var(--s2);border:1px solid var(--br2);color:var(--t2)}
.btn-r{background:rgba(255,56,96,.07);border:1px solid rgba(255,56,96,.2);color:var(--red)}

/* Result */
.result-box{
  background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);
  border-radius:12px;padding:18px;margin-top:14px;display:none;text-align:center;
  position:relative;overflow:hidden
}
.result-box::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.15),transparent 70%);
  pointer-events:none
}
.result-key{
  font-size:15px;font-weight:700;font-family:'Syne',sans-serif;
  background:linear-gradient(90deg,#7c3aed,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;word-break:break-all;cursor:pointer;margin-bottom:8px
}
.result-meta{font-size:9px;color:var(--t3);margin-top:4px;letter-spacing:.5px}

/* Key history */
.key-item{
  background:var(--s2);border:1px solid var(--br);border-radius:10px;
  padding:12px;margin-bottom:8px
}
.ki-key{
  font-size:11px;font-weight:700;word-break:break-all;cursor:pointer;
  font-family:'Syne',sans-serif;letter-spacing:1px;
  background:linear-gradient(90deg,#7c3aed,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:6px
}
.ki-meta{font-size:9px;color:var(--t3);line-height:1.8}
.ki-meta span{color:var(--t2)}

/* Status */
.sbox{padding:11px 14px;border-radius:10px;font-size:10px;margin-top:12px;display:none;line-height:1.8;white-space:pre-line}
.s-ok{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);color:#a78bfa}
.s-err{background:rgba(255,56,96,.07);border:1px solid rgba(255,56,96,.2);color:var(--red)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--s3);border:1px solid var(--br2);color:var(--t1);
  font-size:10px;padding:10px 18px;border-radius:10px;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:999;
  font-family:'Space Mono',monospace;box-shadow:0 8px 32px rgba(0,0,0,.4)
}
.toast.show{opacity:1}

.page{display:none;padding:16px;position:relative;z-index:1}
.page.active{display:block}
.tabs{
  display:flex;background:var(--s1);border-bottom:1px solid var(--br);
  overflow-x:auto;scrollbar-width:none;position:relative;z-index:1
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:14px 20px;font-size:10px;font-weight:700;color:var(--t3);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  letter-spacing:2px;transition:all .2s;flex-shrink:0
}
.tab.active{color:var(--g);border-bottom-color:var(--g)}
.empty{text-align:center;padding:32px;font-size:10px;color:var(--t3);letter-spacing:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-icon">FO</div>
  <div class="tb-title">FERGIVE <span>OS</span></div>
  <div class="tb-badge" id="topBadge" style="display:none">RESELLER</div>
  <div class="tb-dot"></div>
</div>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><span>FERGIVE OS</span></div>
      <div class="login-sub">RESELLER PANEL</div>
      <div class="reseller-name-display" id="resellerNameDisplay">Loading...</div>
      <span class="lbl">PASSWORD</span>
      <input class="inp" id="passInput" type="password" placeholder="Enter your password..."/>
      <button class="btn btn-g" onclick="doLogin()">LOGIN →</button>
      <div class="sbox" id="loginStatus"></div>
    </div>
  </div>
</div>

<!-- MAIN PANEL -->
<div id="mainPanel" style="display:none">
  <div class="tabs">
    <div class="tab active" data-tab="generate" onclick="switchTab(this)">⚡ Generate Key</div>
    <div class="tab" data-tab="history" onclick="switchTab(this)">🗝 My Keys</div>
  </div>

  <!-- GENERATE TAB -->
  <div class="page active" id="page-generate">

    <div class="credits-display">
      <div class="credits-num" id="creditsNum">—</div>
      <div class="credits-label">CREDITS REMAINING</div>
      <div class="credits-sub">1 credit = 1 key</div>
    </div>

    <div class="card">
      <div class="card-head">GENERATE NEW KEY</div>

      <span class="lbl">DURATION</span>
      <div class="row2">
        <input class="inp" id="durVal" type="number" value="10" min="1"/>
        <select class="inp" id="durUnit">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          <option value="days">Days</option>
          <option value="months">Months</option>
          <option value="lifetime">Lifetime</option>
        </select>
      </div>

      <span class="lbl">LABEL (optional)</span>
      <input class="inp" id="keyLabel" type="text" placeholder="e.g. Customer name"/>

      <button class="btn btn-g" id="genBtn" onclick="generateKey()">⚡ GENERATE KEY</button>

      <div class="result-box" id="resultBox">
        <div style="font-size:8px;color:var(--t3);letter-spacing:2px;margin-bottom:10px">KEY GENERATED ✓</div>
        <div class="result-key" id="resultKey" onclick="copyText(this.textContent)"></div>
        <div class="result-meta" id="resultMeta"></div>
        <div style="font-size:8px;color:rgba(124,58,237,.5);margin-top:8px;letter-spacing:1px">TAP TO COPY</div>
      </div>

      <div class="sbox" id="genStatus"></div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div class="page" id="page-history">
    <div class="card" style="padding:14px">
      <div class="card-head">KEYS I GENERATED</div>
      <div id="historyList"><div class="empty">No keys generated yet</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://fergive-os.vercel.app/api';

// Get reseller username from URL: /rahul/login → rahul
function getResellerSlug(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  // URL: /rahul/login → parts = ['rahul','login']
  // URL: /rahul → parts = ['rahul']
  if(parts.length>=1) return parts[0].toLowerCase();
  return null;
}

let SLUG = '';
let PASS = '';
let keyHistory = [];

window.onload = function(){
  SLUG = getResellerSlug();
  if(!SLUG){
    document.getElementById('resellerNameDisplay').textContent = 'Invalid link!';
    return;
  }
  document.getElementById('resellerNameDisplay').textContent = '👤 ' + SLUG.toUpperCase();
  document.title = `${SLUG.toUpperCase()} — Reseller Panel`;
};

function doLogin(){
  const pass = document.getElementById('passInput').value.trim();
  if(!pass){ showSbox('loginStatus','Enter password!','err'); return; }
  showSbox('loginStatus','Logging in...','ok');
  fetch(`${API}?action=reseller_login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:SLUG, password:pass})
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.success){
      PASS = pass;
      document.getElementById('loginPage').style.display='none';
      document.getElementById('mainPanel').style.display='block';
      document.getElementById('topBadge').style.display='block';
      document.getElementById('creditsNum').textContent = d.reseller.credits;
    } else {
      showSbox('loginStatus', d.message||'Login failed!','err');
    }
  })
  .catch(()=>showSbox('loginStatus','Connection error!','err'));
}

function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+el.dataset.tab).classList.add('active');
  if(el.dataset.tab==='history') renderHistory();
}

function calcExpiry(v,u){
  if(u==='lifetime') return null;
  const d=new Date();
  if(u==='minutes') d.setMinutes(d.getMinutes()+v);
  else if(u==='hours') d.setHours(d.getHours()+v);
  else if(u==='days') d.setDate(d.getDate()+v);
  else if(u==='months') d.setMonth(d.getMonth()+v);
  return d.toISOString();
}

function fmtDate(d){
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+
    d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

async function generateKey(){
  const credits = parseInt(document.getElementById('creditsNum').textContent)||0;
  if(credits<=0){
    showSbox('genStatus','No credits! Contact your admin.','err');
    return;
  }
  const val = parseInt(document.getElementById('durVal').value)||10;
  const unit = document.getElementById('durUnit').value;
  const label = document.getElementById('keyLabel').value.trim();
  const exp = calcExpiry(val,unit);
  const btn = document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='Generating...';
  document.getElementById('resultBox').style.display='none';
  showSbox('genStatus','Please wait...','ok');

  try{
    const r = await fetch(`${API}?action=reseller_generate_key`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:SLUG, password:PASS, expires_at:exp, label:label||SLUG})
    });
    const d = await r.json();
    btn.disabled=false; btn.textContent='⚡ GENERATE KEY';

    if(d.success){
      document.getElementById('genStatus').style.display='none';
      document.getElementById('creditsNum').textContent = d.credits_left;
      document.getElementById('resultBox').style.display='block';
      document.getElementById('resultKey').textContent = d.key;
      document.getElementById('resultMeta').textContent =
        `${exp?'Expires: '+fmtDate(new Date(exp)):'Lifetime'}  |  Credits left: ${d.credits_left}`;
      document.getElementById('keyLabel').value='';
      // Save to history
      keyHistory.unshift({key:d.key, exp, label:label||SLUG, created:new Date().toISOString(), credits_left:d.credits_left});
      toast('Key generated!');
    } else {
      showSbox('genStatus', d.message||'Failed!','err');
    }
  }catch(e){
    btn.disabled=false; btn.textContent='⚡ GENERATE KEY';
    showSbox('genStatus','Connection error!','err');
  }
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!keyHistory.length){
    list.innerHTML='<div class="empty">No keys generated yet</div>';
    return;
  }
  list.innerHTML = keyHistory.map(({key,exp,label,created,credits_left})=>`
    <div class="key-item">
      <div class="ki-key" onclick="copyText('${key}')" title="Tap to copy">${key}</div>
      <div class="ki-meta">
        Label: <span>${label||'—'}</span><br>
        Expires: <span>${exp?fmtDate(new Date(exp)):'Lifetime'}</span><br>
        Created: <span>${fmtDate(new Date(created))}</span>
      </div>
    </div>
  `).join('');
}

function copyText(t){
  navigator.clipboard.writeText(t).then(()=>toast('Copied!')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); toast('Copied!');
  });
}
function showSbox(id,msg,type){
  const el=document.getElementById(id);
  el.textContent=msg; el.className='sbox s-'+(type==='ok'?'ok':'err');
  el.style.display='block';
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
</body>
</html>
